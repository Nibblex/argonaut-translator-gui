[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "argonaut-translator-gui"
dynamic = ["version"]
description = "Minimalist offline document translator for the desktop (PyQt5, Argos Translate and NLLB-200)"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Sergio Rodríguez", email = "srodriguez3441@gmail.com" },
]
# current pymupdf wheels need 3.10; CI tests every version listed below
requires-python = ">=3.10"
keywords = ["translation", "documents", "offline", "argos-translate", "nllb", "pdf"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "PyQt5",
    # the engine: a major version is a change the window has to follow
    "argonaut-translator-cli>=2,<3",
    # imported directly for the engine settings and the About dialog
    "argos-translate-lt",
    "psutil",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "pytest-qt"]

[project.urls]
Homepage = "https://github.com/Nibblex/Argonaut"
Issues = "https://github.com/Nibblex/Argonaut/issues"

[project.scripts]
argonaut = "argonaut_gui.main:main"

[tool.setuptools.dynamic]
version = { attr = "argonaut_gui.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# the interface strings and the language names are data files read at
# runtime, so the wheel has to carry them next to the modules
[tool.setuptools.package-data]
argonaut_gui = ["locales/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=argonaut_gui --cov-report=term-missing"

[tool.coverage.run]
source = ["argonaut_gui"]
# pure app bootstrap: running it starts the Qt event loop
omit = ["*/argonaut_gui/__main__.py"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]
